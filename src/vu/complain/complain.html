<!DOCTYPE html>
<!-- Complaint workspace: submit evidence and review locally stored complaint history. -->
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gửi khiếu nại | BookMooch</title><link rel="stylesheet" href="../../shared/styles/global-design-tokens.css"><link rel="stylesheet" href="../../shared/sidebar/sidebar.css"><link rel="stylesheet" href="complain.css"></head>
<body><div class="app-shell"><div data-sidebar-mount></div><main class="app-main"><header class="page-header"><div><p class="eyebrow">Hỗ trợ & Chăm sóc</p><h1 class="page-title">Gửi khiếu nại</h1><p class="page-subtitle">Gửi thông tin sự cố và bằng chứng để đội ngũ chăm sóc xử lý nhanh hơn.</p></div></header><div class="content-grid two-columns"><section class="surface-card"><h2>Thông tin sự cố</h2><form id="complain-form" class="form-grid"><div class="form-grid two-columns"><div class="field"><label for="order-id">Mã đơn hàng</label><input id="order-id" name="orderId" placeholder="Ví dụ: BM-2026-001" required><small class="field-error" data-error-for="orderId"></small></div><div class="field"><label for="issue-type">Loại sự cố</label><select id="issue-type" name="issueType" required><option value="">Chọn loại sự cố</option><option>Giao sai truyện</option><option>Truyện hư hỏng</option><option>Gian lận</option><option>Khác</option></select></div></div><div class="field"><label for="description">Mô tả chi tiết</label><textarea id="description" name="description" placeholder="Mô tả thời gian, diễn biến và mong muốn hỗ trợ của bạn" required></textarea><small class="field-error" data-error-for="description"></small></div><div class="field"><label for="evidence">Ảnh/video bằng chứng</label><input id="evidence" name="evidence" type="file" accept="image/*,video/*" multiple><small class="file-note" data-file-note>Chưa chọn tệp</small></div><div class="form-actions"><button class="button" type="submit">Gửi khiếu nại</button></div></form></section><section class="surface-card"><h2>Lịch sử khiếu nại</h2><div class="history-list" data-complaint-list></div></section></div></main></div><div class="toast-region" data-toast-region aria-live="polite"></div><script type="module" src="../../shared/sidebar/sidebar.js"></script><script type="module" src="complain.js"></script></body></html>
